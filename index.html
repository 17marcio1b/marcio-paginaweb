<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
          header{
            background-color: #2B353F;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px; 
        }  
        main {
            background-color: #FFFFFF;
            color: #2B353F;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;    
        }

        img{
            width: 80px;
            height: 80px;
        }
        .artigo-autor {
            font-weight: bold;
        }

        </style>
    </head>
<body>
        <header>
            <h1>meu blog tech</h1>
            <p>Vou compartilhar conhecimentos e dicas sobre o jogo overwatch</p>
        </header>
    <main>
            <img src="imagem.jpeg" alt="Doomfist do jogo overwatch">
                <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Marcio Leonardo</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de overwatch e suas novidades</p>
                <button>❤️ <span>0</span></button>
                <button>👎 <span>0</span></button>
                </div>

    </main>
</body> 
<script>
    const botoes = document.querySelector("button");

    botoes.forEach( function(botao){
        botao.addEventListener("click", botaoClicado);
        function botaoClicado(){
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    })


</script>
</html>
